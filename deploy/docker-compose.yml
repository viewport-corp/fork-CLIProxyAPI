services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:v7.2.48
    pull_policy: always
    container_name: cli-proxy-api
    environment:
      DEPLOY: ${DEPLOY:-}
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:?set in .env}
    expose:
      - "8317"
      - "8085"
      - "1455"
      - "54545"
      - "51121"
      - "11451"
    volumes:
      - /opt/platformx/cliproxy/config.yaml:/CLIProxyAPI/config.yaml:ro
      - /opt/platformx/cliproxy/auths:/root/.cli-proxy-api:ro
      - /opt/platformx/cliproxy/logs:/CLIProxyAPI/logs
    restart: unless-stopped
